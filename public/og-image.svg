<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Jacquard+12&amp;display=swap');
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#1DB954"/>

  <!-- Subtle gradient overlay -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1ed760" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1DB954" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Moodlist wordmark -->
  <text
    x="600"
    y="340"
    font-family="'Jacquard 12', serif"
    font-size="140"
    fill="white"
    text-anchor="middle"
    dominant-baseline="middle"
  >Moodlist</text>

  <!-- Tagline -->
  <text
    x="600"
    y="420"
    font-family="system-ui, -apple-system, sans-serif"
    font-size="32"
    fill="rgba(255,255,255,0.85)"
    text-anchor="middle"
    font-weight="400"
  >Transform photos into playlists</text>
</svg>